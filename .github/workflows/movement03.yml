name: Archive Jamesy idle and bank art
on:
  push:
    branches: ['art/storybook-bible-v1-20260928']
    paths:
      - '.github/workflows/movement03.yml'
      - 'production/tools/movement03*'
      - 'art/01-characters/hulk/movement-reviews/v01/sources.json'
permissions:
  contents: write
concurrency:
  group: jamesy-art-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/art/storybook-bible-v1-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/storybook-bible-v1-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing art dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Archive the explicitly selected character source images
        run: python production/tools/movement03_import.py
      - name: Build and check review exports when the reviewed exporter is present
        run: |
          if test -f production/tools/movement03_export.py; then
            python -m unittest discover -s production/tools -p movement03_test.py -v
            python production/tools/movement03_export.py
          fi
          python production/tools/prepare_art.py
      - name: Commit artwork only
        run: |
          git add -- art
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive Hulk Jamesy idle and banking review artwork'
            git push origin HEAD:refs/heads/art/storybook-bible-v1-20260928
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jamesy-idle-banks
          path: |
            art/01-characters/hulk/movement-reviews/v01/
            production/tools/movement03*
          retention-days: 14
