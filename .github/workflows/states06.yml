name: Archive Jamesy power-up recovery and idle art
on:
  push:
    branches: ['art/storybook-bible-v1-20260928']
    paths:
      - 'art/01-characters/hulk/state-reviews/v01/sources.json'
      - 'production/states06/**'
      - '.github/workflows/states06.yml'
permissions:
  contents: write
concurrency:
  group: jamesy-art-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/art/storybook-bible-v1-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/storybook-bible-v1-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Archive three already-generated source images
        run: python production/states06/import_sources.py
      - name: Validate and export review poses when the exporter is present
        run: |
          if [ -f production/states06/test_export.py ]; then python -m unittest discover -s production/states06 -p test_export.py -v; fi
          if [ -f production/states06/export.py ]; then python production/states06/export.py; fi
          python production/tools/prepare_art.py
      - name: Save artwork only on the art branch
        run: |
          git add -- art/01-characters/hulk/state-reviews/v01 art/inventory.json art/gallery.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive Hulk Jamesy power-up recovery and menu-idle review artwork'
            git push origin HEAD:refs/heads/art/storybook-bible-v1-20260928
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jamesy-states06
          path: |
            art/01-characters/hulk/state-reviews/v01/
            production/states06/
            production/tools/movement03_export.py
          retention-days: 14
