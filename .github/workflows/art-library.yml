name: Archive Jamesy art library
on:
  push:
    branches: ['art/storybook-bible-v1-20260928']
    paths:
      - 'art/import-queue.json'
      - 'art/character-batch-02.json'
      - 'art/run-revision-02.json'
      - 'production/tools/**'
      - 'production/art-bible-v1/ART_BIBLE_v1.2.md'
      - '.github/workflows/art-library.yml'
permissions:
  contents: write
concurrency:
  group: jamesy-art-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/art/storybook-bible-v1-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/storybook-bible-v1-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art tools only
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0 reportlab==4.4.9
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core)
      - name: Check the importer boundary
        run: python -m unittest discover -s production/tools -p test_archive.py -v
      - name: Recover the completed character source sheets
        run: |
          python production/tools/recover_character_sources.py
          python production/tools/recover_run_v02.py
      - name: Check sprite alpha, path and canvas handling
        run: python -m unittest discover -s production/tools -p test_character_sprites.py -v
      - name: Extract candidate character sprites without changing motion
        run: python production/tools/character_sprites.py
      - name: Archive explicit image files and build the bible
        run: |
          python production/tools/archive_art.py
          python production/tools/prepare_art.py
          python production/tools/build_bible.py
      - name: Commit art only to the art branch
        run: |
          git add -- art production/art-bible-v1/Jamesy-Art-Bible-v1.2.pdf
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive Jamesy character revisions and factual inventory'
            git push origin HEAD:refs/heads/art/storybook-bible-v1-20260928
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jamesy-art-library
          path: |
            art/
            production/art-bible-v1/
          retention-days: 14
